<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recherche de lycées d'Île-de-France</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --border: #dfe7f3;
      --primary: #0d6efd;
      --primary-dark: #0a58ca;
      --text: #1f2937;
      --muted: #6b7280;
      --shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin: 20px 20px 10px;
      font-size: 2rem;
    }

    .filters {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin: 0 20px 20px;
      padding: 20px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px 24px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    select,
    input,
    button {
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    select,
    input {
      width: 100%;
      background: #fff;
    }

    select[multiple] {
      min-height: 120px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
      align-items: center; /* Alignement vertical pour le compteur */
    }

    button {
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: white;
      font-weight: 600;
      min-width: 160px;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #e9ecef;
      color: var(--text);
    }

    .secondary:hover {
      background: #dfe3e8;
    }

    .instructions {
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .container {
      display: flex;
      gap: 20px;
      margin: 0 20px 30px;
      position: relative;
    }

    .map-container {
      width: 60%;
      min-height: 620px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    #map {
      width: 100%;
      height: 620px;
      background: #dfeaf7;
    }

    .results {
      width: 40%;
      max-height: 620px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 12px;
      position: relative;
      z-index: 1;
    }

    .lycee-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      margin-bottom: 12px;
      background: #fff;
      position: relative;
    }

    .lycee-card h3 {
      margin: 0 0 6px;
      font-size: 1.05rem;
    }

    .lycee-card p {
      margin: 5px 0;
      line-height: 1.4;
      font-size: 0.92rem;
    }

    .lycee-card ul {
      margin: 8px 0 0 18px;
      padding: 0;
    }

    .formation-toggle {
      margin-top: 8px;
      background: #e9ecef;
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      min-width: auto;
      padding: 6px 12px;
    }

    .formation-toggle:hover {
      background: #dfe3e8;
    }

    .hidden {
      display: none;
    }

    .empty-state {
      padding: 20px;
      color: var(--muted);
      font-style: italic;
    }

    /* Style pour les liens ONISEP */
    .onisep-link {
      color: var(--primary);
      text-decoration: none;
      margin-left: 6px;
      font-size: 0.9em;
      cursor: pointer;
    }

    .onisep-link:hover {
      text-decoration: underline;
    }

    /* Style pour les tooltips */
    .formation-item {
      position: relative;
      cursor: default;
      z-index: 2;
    }

    .tooltip {
      visibility: hidden;
      position: absolute;
      left: 0;
      top: 100%;
      margin-top: 5px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
      white-space: normal;
      box-shadow: var(--shadow);
      z-index: 1000;
      max-width: 280px;
      width: max-content;
      pointer-events: none;
    }

    .formation-item:hover .tooltip {
      visibility: visible;
    }

    .tooltip::after {
      content: "";
      position: absolute;
      top: -6px;
      left: 14px;
      border-width: 6px;
      border-style: solid;
      border-color: transparent transparent var(--border) transparent;
    }

    /* Style pour le compteur de résultats */
    .result-counter {
      margin-left: auto;
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .result-counter.hidden {
      display: none;
    }

    .result-counter span {
      font-weight: 600;
      color: var(--primary);
    }

    .filter-detail {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    @media (max-width: 980px) {
      .container {
        flex-direction: column;
      }

      .map-container,
      .results {
        width: 100%;
      }

      .button-row {
        flex-direction: column;
        align-items: stretch;
      }

      .result-counter {
        margin-left: 0;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <h1>Recherche de lycées professionnels et de formations</h1>

  <div class="filters">
    <div class="instructions">Utilisez Ctrl/Cmd + clic pour sélectionner plusieurs valeurs.</div>

    <div class="filters-grid">
      <div class="field">
        <label for="riasec">Domaines RIASEC</label>
        <select id="riasec" multiple>
          <option value="R">Réaliste</option>
          <option value="I">Investigateur</option>
          <option value="A">Artistique</option>
          <option value="S">Social</option>
          <option value="E">Entreprenant</option>
          <option value="C">Conventionnel</option>
        </select>
      </div>

      <div class="field">
        <label for="typeFormation">Type de formation</label>
        <select id="typeFormation" multiple>
          <option value="EDS">Bac général / spécialités</option>
          <option value="techno">Bac technologique</option>
          <option value="pro">Bac professionnel</option>
          <option value="CAP">CAP</option>
        </select>
      </div>

      <div class="field">
        <label for="nomFormation">Nom / code de la formation</label>
        <input id="nomFormation" type="text" placeholder="Ex: STI2D, NSI, Math, Arts" />
      </div>

      <div class="field">
        <label for="academies">Académie</label>
        <select id="academies" multiple>
          <option value="Paris">Paris</option>
          <option value="Versailles">Versailles</option>
          <option value="Créteil">Créteil</option>
        </select>
      </div>

      <div class="field hidden" id="departementsWrapper">
        <label for="departements">Département</label>
        <select id="departements" multiple>
          <option value="Paris">Paris</option>
          <option value="Yvelines">Yvelines</option>
          <option value="Essonne">Essonne</option>
          <option value="Hauts-de-Seine">Hauts-de-Seine</option>
          <option value="Val-d'Oise">Val-d'Oise</option>
          <option value="Val-de-Marne">Val-de-Marne</option>
          <option value="Seine-et-Marne">Seine-et-Marne</option>
          <option value="Seine-Saint-Denis">Seine-Saint-Denis</option>
        </select>
      </div>

      <div class="field">
        <label for="internat">Internat</label>
        <select id="internat">
          <option value="">Tous</option>
          <option value="1">Oui</option>
          <option value="0">Non</option>
        </select>
      </div>
    </div>

    <div class="button-row">
      <button id="applyBtn" type="button">Appliquer les filtres</button>
      <button id="resetBtn" type="button" class="secondary">Réinitialiser</button>
      <!-- Compteur de résultats avec détail des filtres -->
      <div id="resultCounter" class="result-counter hidden">
        <span id="lyceeCount">0</span> établissement(s) ;
        <span id="formationCount">0</span> formation(s)
        <div id="filterDetail" class="filter-detail"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="map-container">
      <div id="map"></div>
    </div>
    <div id="results" class="results"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Lien ONISEP unique pour toutes les EDS
    const ONISEP_EDS_LINK = "https://www.onisep.fr/formation/apres-la-2-les-poursuites-d-etudes/les-enseignements-de-specialite-en-voie-generale";

    // Données de fallback minimales (pour le développement local)
    const fallbackLycees = [
      {
        id: "LYC001",
        nom: "Lycée Polyvalent Dorian",
        adresse: "12 rue de la Montagne Sainte-Geneviève, 75005 Paris",
        academie: "Paris",
        departement: "Paris",
        email: "contact@lyc-dorian.fr",
        telephone: "01 45 88 32 10",
        latitude: 48.8419,
        longitude: 2.3636,
        internat: 0,
        formations: [
          { id: "NSI", type: "EDS" },
          { id: "SVT", type: "EDS" },
          { id: "RNCP35634", type: "pro" }
        ]
      },
      {
        id: "LYC002",
        nom: "Lycée Technologique ABC",
        adresse: "10 rue des Études, 75000 Paris",
        academie: "Paris",
        departement: "Paris",
        email: "contact@lyc-abc.fr",
        telephone: "01 23 45 67 89",
        latitude: 48.8566,
        longitude: 2.3522,
        internat: 1,
        formations: [
          { id: "STI2D-AC", type: "techno" },
          { id: "STI2D-SIN", type: "techno" },
          { id: "STMG-GF", type: "techno" }
        ]
      }
    ];

    // État global de l'application
    const state = {
      lycees: [],
      onisepLinks: {},
      descriptions: {},
      riasec: {},
      noms: {}
    };

    // Initialisation de la carte Leaflet
    const map = L.map('map').setView([48.8566, 2.3522], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    const markersLayer = L.layerGroup().addTo(map);

    // Fonction pour récupérer les valeurs sélectionnées dans un <select multiple>
    function getSelectedValues(selectId) {
      const select = document.getElementById(selectId);
      return Array.from(select.selectedOptions).map(option => option.value);
    }

    // Normalisation des chaînes de caractères pour la recherche
    function normalize(value) {
      return String(value || '').trim().toLowerCase();
    }

    // Récupère le libellé du type de formation
    function getTypeLabel(type) {
      const labels = {
        EDS: 'Bac général / spécialités',
        techno: 'Bac technologique',
        pro: 'Bac professionnel',
        CAP: 'CAP'
      };
      return labels[type] || type;
    }

    // Charge les liens et descriptions ONISEP
    async function loadOnisepData() {
      const candidates = ['./onisep_links.json', '/onisep_links.json', 'onisep_links.json'];
      let lastError = null;

      for (const url of candidates) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          state.onisepLinks = data.links || {};
          state.descriptions = data.descriptions || {};
          state.riasec = data.riasec || {};
          state.noms = data.noms || {};
          return;
        } catch (error) {
          lastError = error;
        }
      }

      console.warn('Chargement de onisep_links.json impossible.', lastError);
      // Fallback : données par défaut
      state.onisepLinks = {
        EDS: { NSI: ONISEP_EDS_LINK, SVT: ONISEP_EDS_LINK },
        techno: {},
        pro: {},
        CAP: {}
      };
      state.descriptions = {
        EDS: {
          NSI: "Numérique et Sciences Informatiques : Apprentissage de la programmation, des algorithmes et des systèmes informatiques.",
          SVT: "Sciences de la Vie et de la Terre : Étude des êtres vivants, de la Terre et des phénomènes naturels."
        },
        techno: {},
        pro: {},
        CAP: {}
      };
      state.riasec = {
        EDS: {
          NSI: ["I", "R"],
          SVT: ["I", "R"]
        },
        techno: {},
        pro: {},
        CAP: {}
      };
      state.noms = {
        EDS: {
          NSI: "Numériques et Sciences Informatiques",
          SVT: "Sciences et vie de la Terre"
        },
        techno: {},
        pro: {},
        CAP: {}
      };
    }

    // Charge les données des lycées
    async function loadLyceesData() {
      const candidates = ['./data.json', '/data.json', 'data.json'];
      let lastError = null;

      for (const url of candidates) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          state.lycees = await response.json();
          return;
        } catch (error) {
          lastError = error;
        }
      }

      console.warn('Chargement de data.json impossible, utilisation du fallback local.', lastError);
      state.lycees = fallbackLycees;
    }

    // Charge toutes les données nécessaires
    async function loadData() {
      await Promise.all([loadOnisepData(), loadLyceesData()]);
      applyFilters();
    }

    // Récupère le nom d'une formation
    function getFormationNom(formation) {
      const type = formation.type;
      const id = formation.id;
      return state.noms[type]?.[id] || id;
    }

    // Récupère la description d'une formation
    function getFormationDescription(formation) {
      const type = formation.type;
      const id = formation.id;
      return state.descriptions[type]?.[id] || "Description non disponible.";
    }

    // Récupère le lien ONISEP d'une formation
    function getOnisepLink(formation) {
      const type = formation.type;
      const id = formation.id;

      // Pour les EDS, utiliser le lien générique si non spécifié
      if (type === "EDS" && !state.onisepLinks[type]?.[id]) {
        return ONISEP_EDS_LINK;
      }

      return state.onisepLinks[type]?.[id] || null;
    }

    // Récupère les codes RIASEC d'une formation
    function getFormationRiasec(formation) {
      const type = formation.type;
      const id = formation.id;
      return state.riasec[type]?.[id] || [];
    }

    // Vérifie si une formation correspond aux filtres
    function matchesFormation(formation, filters) {
      const selectedTypes = filters.types;
      const selectedRiasec = filters.riasec;
      const search = filters.search;

      if (selectedTypes.length > 0 && !selectedTypes.includes(formation.type)) {
        return false;
      }

      if (selectedRiasec.length > 0) {
        const formationRiasec = getFormationRiasec(formation);
        const matchRiasec = selectedRiasec.some(code => formationRiasec.includes(code));
        if (!matchRiasec) return false;
      }

      if (search) {
        const nom = getFormationNom(formation);
        const haystack = [nom, formation.id, formation.type]
          .join(' ')
          .toLowerCase();
        if (!haystack.includes(search)) return false;
      }

      return true;
    }

    // Vérifie si un lycée correspond aux filtres
    function matchesFilters(lycee, filters) {
      if (filters.academies.length > 0 && !filters.academies.includes(lycee.academie)) {
        return false;
      }

      if (filters.departements.length > 0) {
        if (!lycee.departement || !filters.departements.includes(lycee.departement)) {
          return false;
        }
      }

      if (filters.internat !== '' && String(lycee.internat) !== String(filters.internat)) {
        return false;
      }

      if (filters.types.length > 0 || filters.riasec.length > 0 || filters.search) {
        const matchingFormations = (lycee.formations || []).filter(formation => matchesFormation(formation, filters));
        if (matchingFormations.length === 0) return false;
      }

      return true;
    }

    // Affiche les marqueurs sur la carte
    function renderMarkers(lycees) {
      markersLayer.clearLayers();

      lycees.forEach(lycee => {
        if (!lycee.latitude || !lycee.longitude) return;

        const marker = L.marker([lycee.latitude, lycee.longitude]);
        const formationsList = (lycee.formations || [])
          .map(f => {
            const nom = getFormationNom(f);
            const type = f.type;
            const riasec = getFormationRiasec(f).length > 0 ? ` - RIASEC: ${getFormationRiasec(f).join(', ')}` : '';
            const description = getFormationDescription(f);
            const link = getOnisepLink(f);
            const linkHtml = link ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="onisep-link" title="${description}">En savoir plus</a>` : '';
            return `- ${f.id} (${getTypeLabel(type)})${riasec} ${linkHtml}`;
          })
          .join('<br>');

        marker.bindPopup(`
          <b>${lycee.nom}</b><br>
          ${lycee.adresse}<br>
          ${lycee.email}<br>
          ${lycee.telephone || 'Non renseigné'}<br>
          Internat : ${lycee.internat === 1 ? 'Oui' : 'Non'}<br><br>
          <b>Formations :</b><br>
          ${formationsList || 'Aucune formation'}
        `);

        marker.addTo(markersLayer);
      });
    }

    // Génère le HTML pour une formation dans les résultats
    function renderFormationItem(f) {
      const nom = getFormationNom(f);
      const type = f.type;
      const riasec = getFormationRiasec(f).length > 0 ? ` — RIASEC: ${getFormationRiasec(f).join(', ')}` : '';
      const description = getFormationDescription(f);
      const link = getOnisepLink(f);
      const linkHtml = link ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="onisep-link" title="${description}">En savoir plus</a>` : '';

      return `
        <li class="formation-item">
          <strong>${f.id}</strong> — ${nom} (${getTypeLabel(type)})
          ${riasec} ${linkHtml}
          <span class="tooltip">${description}</span>
        </li>
      `;
    }

    // Affiche les résultats dans le panneau latéral
    function renderResults(lycees, filters) {
      const resultsEl = document.getElementById('results');

      if (!lycees.length) {
        resultsEl.innerHTML = '<div class="empty-state">Aucun lycée ne correspond à vos critères.</div>';
        return;
      }

      const hasFormationFilters = filters.types.length > 0 || filters.riasec.length > 0 || !!filters.search;

      resultsEl.innerHTML = lycees.map(lycee => {
        const allFormations = lycee.formations || [];
        const matchingFormations = hasFormationFilters
          ? allFormations.filter(f => matchesFormation(f, filters))
          : allFormations;
        const otherFormations = allFormations.filter(f => !matchingFormations.includes(f));

        const matchingHtml = matchingFormations.map(renderFormationItem).join('');
        const otherHtml = otherFormations.map(renderFormationItem).join('');

        const showToggle = otherFormations.length > 0;
        const toggleId = `toggle-${lycee.id.replace(/[^a-zA-Z0-9]/g, '')}`;
        const extraId = `extra-${lycee.id.replace(/[^a-zA-Z0-9]/g, '')}`;

        return `
          <div class="lycee-card">
            <h3>${lycee.nom}</h3>
            <p><strong>UAI :</strong> ${lycee.id}</p>
            <p><strong>Adresse :</strong> ${lycee.adresse}</p>
            <p><strong>Email :</strong> ${lycee.email}</p>
            <p><strong>Téléphone :</strong> ${lycee.telephone || 'Non renseigné'}</p>
            <p><strong>Académie :</strong> ${lycee.academie} ${lycee.departement ? `(${lycee.departement})` : ''}</p>
            <p><strong>Internat :</strong> ${lycee.internat === 1 ? 'Oui' : 'Non'}</p>
            <p><strong>Formations${hasFormationFilters ? ` (${matchingFormations.length}/${allFormations.length})` : ''} :</strong></p>
            <ul>${matchingHtml || '<li>Aucune formation correspondante</li>'}</ul>
            ${showToggle ? `
              <button class="formation-toggle" id="${toggleId}" type="button" onclick="(function(btn){var extra=document.getElementById('${extraId}');var hidden=extra.classList.contains('hidden');extra.classList.toggle('hidden');btn.textContent=hidden?'Masquer les autres formations':'Voir toutes les formations ('+${otherFormations.length}+')';})(this)">Voir toutes les formations (${otherFormations.length})</button>
              <ul id="${extraId}" class="hidden">${otherHtml}</ul>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // Affiche/masque le filtre des départements
    function toggleDepartments() {
      const academies = getSelectedValues('academies');
      const departementsWrapper = document.getElementById('departementsWrapper');
      const shouldShow = academies.some(a => ['Versailles', 'Créteil'].includes(a));

      departementsWrapper.classList.toggle('hidden', !shouldShow);

      if (!shouldShow) {
        document.getElementById('departements').selectedIndex = -1;
      }
    }

    // Fonction pour générer le texte des filtres appliqués
    function getFilterText(filters) {
      const filterParts = [];

      if (filters.riasec.length > 0) {
        const riasecLabels = {
          R: "Réaliste",
          I: "Investigateur",
          A: "Artistique",
          S: "Social",
          E: "Entreprenant",
          C: "Conventionnel"
        };
        const riasecText = filters.riasec.map(code => riasecLabels[code] || code).join(', ');
        filterParts.push(`RIASEC=${riasecText}`);
      }

      if (filters.types.length > 0) {
        const typeLabels = {
          EDS: "Bac général / spécialités",
          techno: "Bac technologique",
          pro: "Bac professionnel",
          CAP: "CAP"
        };
        const typeText = filters.types.map(type => typeLabels[type] || type).join(', ');
        filterParts.push(`Type=${typeText}`);
      }

      if (filters.academies.length > 0) {
        filterParts.push(`Académie=${filters.academies.join(', ')}`);
      }

      if (filters.departements.length > 0) {
        filterParts.push(`Département=${filters.departements.join(', ')}`);
      }

      if (filters.internat !== '') {
        filterParts.push(`Internat=${filters.internat === '1' ? 'Oui' : 'Non'}`);
      }

      if (filters.search) {
        filterParts.push(`Recherche="${filters.search}"`);
      }

      return filterParts.length > 0 ? ` (Filtres : ${filterParts.join(', ')})` : '';
    }

    // Met à jour le compteur de résultats et le détail des filtres
    function updateResultCounter(lycees, filters) {
      const counterEl = document.getElementById('resultCounter');
      const lyceeCountEl = document.getElementById('lyceeCount');
      const formationCountEl = document.getElementById('formationCount');
      const filterDetailEl = document.getElementById('filterDetail');

      // Compter le nombre d'établissements
      const lyceeCount = lycees.length;
      lyceeCountEl.textContent = lyceeCount;

      // Compter le nombre total de formations (filtrées si des filtres sont appliqués)
      let formationCount = 0;
      const hasFormationFilters = filters.types.length > 0 || filters.riasec.length > 0 || !!filters.search;

      lycees.forEach(lycee => {
        const allFormations = lycee.formations || [];
        if (hasFormationFilters) {
          formationCount += allFormations.filter(f => matchesFormation(f, filters)).length;
        } else {
          formationCount += allFormations.length;
        }
      });

      formationCountEl.textContent = formationCount;

      // Mettre à jour le détail des filtres
      filterDetailEl.textContent = getFilterText(filters);

      // Afficher le compteur uniquement si des filtres sont appliqués ou si c'est la première recherche
      counterEl.classList.toggle('hidden', lyceeCount === 0 && formationCount === 0);
    }

    // Applique les filtres
    function applyFilters() {
      const filters = {
        riasec: getSelectedValues('riasec'),
        types: getSelectedValues('typeFormation'),
        academies: getSelectedValues('academies'),
        departements: getSelectedValues('departements'),
        search: normalize(document.getElementById('nomFormation').value),
        internat: document.getElementById('internat').value
      };

      const filteredLycees = state.lycees.filter(lycee => matchesFilters(lycee, filters));
      renderMarkers(filteredLycees);
      renderResults(filteredLycees, filters);
      updateResultCounter(filteredLycees, filters); // Met à jour le compteur et les filtres
    }

    // Réinitialise les filtres
    function resetFilters() {
      document.getElementById('riasec').selectedIndex = -1;
      document.getElementById('typeFormation').selectedIndex = -1;
      document.getElementById('nomFormation').value = '';
      document.getElementById('academies').selectedIndex = -1;
      document.getElementById('departements').selectedIndex = -1;
      document.getElementById('internat').value = '';
      toggleDepartments();
      applyFilters();
    }

    // Initialisation des écouteurs d'événements
    document.getElementById('applyBtn').addEventListener('click', applyFilters);
    document.getElementById('resetBtn').addEventListener('click', resetFilters);
    document.getElementById('academies').addEventListener('change', toggleDepartments);

    // Chargement des données au démarrage
    loadData();
  </script>
</body>
</html>
