<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recherche de lycées et de formations</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --border: #dfe7f3;
      --primary: #0d6efd;
      --primary-dark: #0a58ca;
      --text: #1f2937;
      --muted: #6b7280;
      --shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin: 20px 20px 10px;
      font-size: 2rem;
    }

    .filters {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin: 0 20px 20px;
      padding: 20px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px 24px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    select,
    input,
    button {
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    select,
    input {
      width: 100%;
      background: #fff;
    }

    select[multiple] {
      min-height: 120px;
    }

    .riasec-icons {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .riasec-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5em;
      height: 1.5em;
      font-size: 1.05em;
      line-height: 1;
    }

    #typeFormation option {
      font-weight: 700;
    }

    #typeFormation option.filter-type-eds {
      color: #213d6d;
    }

    #typeFormation option.filter-type-techno {
      color: #d90000;
    }

    #typeFormation option.filter-type-pro {
      color: #008000;
    }

    #typeFormation option.filter-type-cap {
      color: #43b843;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
      align-items: center;
    }

    button {
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: white;
      font-weight: 600;
      min-width: 160px;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #e9ecef;
      color: var(--text);
    }

    .secondary:hover {
      background: #dfe3e8;
    }

    .instructions {
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .view-toggle {
      display: flex;
      gap: 8px;
      margin: 0 20px 16px;
    }

    .view-toggle button {
      min-width: auto;
      padding: 8px 16px;
      font-size: 0.9rem;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .view-toggle button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .container {
      display: flex;
      gap: 20px;
      margin: 0 20px 30px;
      position: relative;
    }

    .container.view-map .map-container { width: 100%; }
    .container.view-map .results { display: none; }

    .container.view-list .map-container { display: none; }
    .container.view-list .results { width: 100%; max-height: none; }

    .map-container {
      width: 60%;
      min-height: 620px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    #map {
      width: 100%;
      height: 620px;
      background: #dfeaf7;
    }

    .results {
      width: 40%;
      max-height: 620px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 12px;
      position: relative;
      z-index: 1;
    }

    .lycee-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      margin-bottom: 12px;
      background: #fff;
      position: relative;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .lycee-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.35), var(--shadow);
    }

    .lycee-card h3 {
      margin: 0 0 6px;
      font-size: 1.05rem;
    }

    .lycee-details {
      margin: 8px 0 12px;
    }

    .lycee-details summary {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #e9ecef;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      list-style-position: inside;
    }

    .lycee-details summary:hover {
      background: #dfe3e8;
    }

    .lycee-details-content {
      margin-top: 8px;
    }

    .lycee-card p {
      margin: 5px 0;
      line-height: 1.4;
      font-size: 0.92rem;
    }

    .lycee-card ul {
      margin: 8px 0 0 18px;
      padding: 0;
    }

    .formation-toggle {
      margin-top: 8px;
      background: #e9ecef;
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      min-width: auto;
      padding: 6px 12px;
    }

    .formation-toggle:hover {
      background: #dfe3e8;
    }

    .hidden {
      display: none;
    }

    .empty-state {
      padding: 20px;
      color: var(--muted);
      font-style: italic;
    }

    /* Style pour les liens ONISEP */
    .onisep-link {
      color: var(--primary);
      text-decoration: none;
      margin-left: 6px;
      font-size: 0.9em;
      cursor: pointer;
    }

    .onisep-link:hover {
      text-decoration: underline;
    }

    /* Style pour les tooltips */
    .formation-item {
      position: relative;
      cursor: default;
      z-index: 2;
    }

    .formation-item:hover {
      z-index: 1000;
    }

    .formation-name {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      border: 2px solid;
    }

    .formation-name-eds {
      border-color: #213d6d;
    }

    .formation-name-techno {
      border-color: #d90000;
    }

    .formation-name-pro {
      border-color: #008000;
    }

    .formation-name-cap {
      border-color: #43b843;
    }

    .tooltip {
      visibility: hidden;
      position: absolute;
      left: 0;
      top: 100%;
      margin-top: 5px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
      white-space: normal;
      box-shadow: var(--shadow);
      z-index: 1000;
      max-width: 280px;
      width: max-content;
      pointer-events: none;
    }

    .formation-item:hover .tooltip {
      visibility: visible;
      z-index: 1001;
    }

    .tooltip::after {
      content: "";
      position: absolute;
      top: -6px;
      left: 14px;
      border-width: 6px;
      border-style: solid;
      border-color: transparent transparent var(--border) transparent;
    }

    /* Style pour le compteur de résultats */
    .result-counter {
      margin-left: auto;
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .result-counter.hidden {
      display: none;
    }

    .result-counter span {
      font-weight: 600;
      color: var(--primary);
    }

    .filter-detail {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Panneau des formations correspondantes */
    .formations-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin: 16px 0 0;
      padding: 16px 20px;
    }

    .formations-panel-header {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .formations-panel-header label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .formations-search {
      flex: 1;
      min-width: 220px;
      max-width: 360px;
      width: auto;
    }

    .formations-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 170px;
      overflow-y: auto;
      padding: 4px;
    }

    .formation-chip {
      border: 2px solid;
      border-radius: 16px;
      background: #fff;
      color: var(--text);
      padding: 5px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      min-width: auto;
      transition: box-shadow 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }

    .formation-chip:hover {
      box-shadow: var(--shadow);
      background: #f1f5f9;
    }

    .formation-chip.eds { border-color: #213d6d; color: #213d6d; }
    .formation-chip.techno { border-color: #d90000; color: #d90000; }
    .formation-chip.pro { border-color: #008000; color: #008000; }
    .formation-chip.cap { border-color: #43b843; color: #2d7d2d; }

    .formation-chip.eds.selected { background: #213d6d; color: #fff; }
    .formation-chip.techno.selected { background: #d90000; color: #fff; }
    .formation-chip.pro.selected { background: #008000; color: #fff; }
    .formation-chip.cap.selected { background: #43b843; color: #fff; }

    @media (max-width: 980px) {
      .container {
        flex-direction: column;
      }

      .map-container,
      .results {
        width: 100%;
      }

      .container.view-list .results {
        max-height: 620px;
      }

      .button-row {
        flex-direction: column;
        align-items: stretch;
      }

      .result-counter {
        margin-left: 0;
        margin-top: 10px;
      }
    }
  </style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
  <h1>Recherche de lycées et de formations</h1>

  <div class="filters">
    <div class="instructions">Utilisez Ctrl/Cmd + clic pour sélectionner plusieurs valeurs.</div>

    <div class="filters-grid">
      <div class="field">
        <label for="riasec">Domaines RIASEC</label>
        <select id="riasec" multiple>
          <option value="R">🔨 Réaliste</option>
          <option value="I">⚗️ Investigateur</option>
          <option value="A">🎨 Artistique</option>
          <option value="S">🤝 Social</option>
          <option value="E">💼 Entreprenant</option>
          <option value="C">🧮 Conventionnel</option>
        </select>
      </div>

      <div class="field">
        <label for="typeFormation">Type de formation</label>
        <select id="typeFormation" multiple>
          <option value="EDS" class="filter-type-eds">Bac général / spécialités</option>
          <option value="techno" class="filter-type-techno">Bac technologique</option>
          <option value="pro" class="filter-type-pro">Bac professionnel</option>
          <option value="cap" class="filter-type-cap">CAP</option>
        </select>
      </div>

      <div class="field">
        <label for="academies">Académie</label>
        <select id="academies" multiple>
          <option value="Paris">Paris</option>
          <option value="Versailles">Versailles</option>
          <option value="Créteil">Créteil</option>
        </select>
      </div>

      <div class="field hidden" id="departementsWrapper">
        <label for="departements">Département</label>
        <select id="departements" multiple></select>
      </div>

      <div class="field">
        <label for="statut">Statut</label>
        <select id="statut" multiple>
          <option value="Public">Public</option>
          <option value="Privé sous contrat">Privé sous contrat</option>
          <option value="Privé">Privé hors contrat</option>
        </select>
      </div>

      <div class="field">
        <label for="internat">Internat</label>
        <select id="internat">
          <option value="">Tous</option>
          <option value="1">Oui</option>
          <option value="0">Non</option>
        </select>
      </div>
    </div>

    <div class="formations-panel">
      <div class="formations-panel-header">
        <label for="formationsSearch">Formations correspondantes (<span id="formationsCount">0</span>)</label>
        <input id="formationsSearch" class="formations-search" type="text" placeholder="&#128269; Rechercher une formation..." />
      </div>
      <div id="formationsList" class="formations-list"></div>
    </div>

    <div class="button-row">
      <button id="resetBtn" type="button" class="secondary">Réinitialiser</button>
      <!-- NOUVEAU : Compteur de résultats avec détail des filtres -->
      <div id="resultCounter" class="result-counter hidden">
        <span id="lyceeCount">0</span> établissement(s) ;
        <span id="formationCount">0</span> formation(s)
        <div id="filterDetail" class="filter-detail"></div>
      </div>
    </div>
  </div>

  <div class="view-toggle">
    <button id="viewBoth" type="button" class="active">Carte + Liste</button>
    <button id="viewMap" type="button">Carte uniquement</button>
    <button id="viewList" type="button">Liste uniquement</button>
  </div>

  <div class="container" id="container">
    <div class="map-container">
      <div id="map"></div>
    </div>
    <div id="results" class="results"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Lien ONISEP unique pour toutes les EDS
    const ONISEP_EDS_LINK = "https://www.onisep.fr/formation/apres-la-2-les-poursuites-d-etudes/les-enseignements-de-specialite-en-voie-generale";

    // Données de fallback minimales (pour le développement local)
    const fallbackLycees = [
      {
        id: "LYC001",
        nom: "Lycée Polyvalent Dorian",
        adresse: "12 rue de la Montagne Sainte-Geneviève, 75005 Paris",
        academie: "Paris",
        departement: "Paris",
        email: "contact@lyc-dorian.fr",
        telephone: "01 45 88 32 10",
        latitude: 48.8419,
        longitude: 2.3636,
        internat: 0,
        formations: [
          { id: "NSI", type: "EDS" },
          { id: "SVT", type: "EDS" },
          { id: "RNCP35634", type: "pro" }
        ]
      },
      {
        id: "LYC002",
        nom: "Lycée Technologique ABC",
        adresse: "10 rue des Études, 75000 Paris",
        academie: "Paris",
        departement: "Paris",
        email: "contact@lyc-abc.fr",
        telephone: "01 23 45 67 89",
        latitude: 48.8566,
        longitude: 2.3522,
        internat: 1,
        formations: [
          { id: "STI2D-AC", type: "techno" },
          { id: "STI2D-SIN", type: "techno" },
          { id: "STMG-GF", type: "techno" }
        ]
      }
    ];

    // État global de l'application
    const state = {
      lycees: [],
      formations: {},   // formations.json : { TYPE: { CODE: { nom, description, lien, riasec } } }
      selectedFormations: new Set(), // formations sélectionnées dans le panneau (clé : type|id)
      chipsCache: []    // formations correspondantes affichées dans le panneau
    };

    // Initialisation de la carte Leaflet
    const map = L.map('map').setView([48.8566, 2.3522], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    const markersLayer = L.layerGroup().addTo(map);
    const markersByLyceeId = new Map(); // marqueurs Leaflet indexés par id de lycée

    // Fonction pour récupérer les valeurs sélectionnées dans un <select multiple>
    function getSelectedValues(selectId) {
      const select = document.getElementById(selectId);
      return Array.from(select.selectedOptions).map(option => option.value);
    }

    // Normalisation des chaînes de caractères pour la recherche
    function normalize(value) {
      return String(value || '').trim().toLowerCase();
    }

    function getArrondissement(lycee) {
      if (lycee.arrondissement) return lycee.arrondissement;

      const postalCode = String(lycee.adresse || '').match(/,\s*(75(?:0\d{2}|1\d{2}))\s+Paris\b/)?.[1];
      if (!postalCode) return '';

      const number = Number(postalCode.slice(-2));
      return number >= 1 && number <= 20 ? `${number}e arrondissement` : '';
    }

    function getDepartmentOption(lycee) {
      const arrondissement = lycee.academie === 'Paris' && lycee.departement === 'Paris'
        ? getArrondissement(lycee)
        : '';

      if (arrondissement) {
        return {
          value: `Paris|${arrondissement}`,
          label: `Paris - ${arrondissement}`
        };
      }

      return {
        value: lycee.departement,
        label: lycee.departement
      };
    }

    const RIASEC_ICONS = {
      R: ['🔨', 'Réaliste'],
      I: ['⚗️', 'Investigateur'],
      A: ['🎨', 'Artistique'],
      S: ['🤝', 'Social'],
      E: ['💼', 'Entreprenant'],
      C: ['🧮', 'Conventionnel']
    };

    function renderRiasecIcons(codes) {
      return `<span class="riasec-icons" aria-label="RIASEC : ${codes.map(code => RIASEC_ICONS[code]?.[1] || code).join(', ')}">${codes.map(code => {
        const [icon, label] = RIASEC_ICONS[code] || [code, code];
        return `<span class="riasec-icon" title="${label}" aria-label="${label}">${icon}</span>`;
      }).join('')}</span>`;
    }

    function getFormationNameClass(type) {
      return `formation-name-${type === 'CAP' ? 'cap' : String(type).toLowerCase()}`;
    }

    function renderFormationName(name, type) {
      return `<span class="formation-name ${getFormationNameClass(type)}">${name}</span>`;
    }

    // Normalise la casse du type pour les recherches dans formations.json
    function normalizeType(type) {
      if (type === 'cap') return 'CAP';
      return type;
    }

    // Charge les données des formations (structure par formation)
    async function loadOnisepData() {
      const candidates = ['./formations.json', '/formations.json', 'formations.json'];
      let lastError = null;

      for (const url of candidates) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          state.formations = data || {};
          return;
        } catch (error) {
          lastError = error;
        }
      }

      console.warn('Chargement de formations.json impossible.', lastError);
      state.formations = { EDS: {}, techno: {}, pro: {}, CAP: {} };
    }

    // Charge les données des lycées
    async function loadLyceesData() {
      const candidates = ['./lycees.json', '/lycees.json', 'lycees.json'];
      let lastError = null;

      for (const url of candidates) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          state.lycees = await response.json();
          return;
        } catch (error) {
          lastError = error;
        }
      }

      console.warn('Chargement de lycees.json impossible, utilisation du fallback local.', lastError);
      state.lycees = fallbackLycees;
    }

    // Charge toutes les données nécessaires
    async function loadData() {
      await Promise.all([loadOnisepData(), loadLyceesData()]);
      updateDepartmentOptions();
      applyFilters();
    }

    // Récupère les informations complètes d'une formation
    function getFormationInfo(formation) {
      const type = normalizeType(formation.type);
      const id = formation.id || formation.nom;
      return state.formations[type]?.[id] || null;
    }

    // Récupère le nom d'une formation
    function getFormationNom(formation) {
      return getFormationInfo(formation)?.nom || formation.id || formation.nom || '—';
    }

    // Récupère la description d'une formation
    function getFormationDescription(formation) {
      return getFormationInfo(formation)?.description || "Description non disponible.";
    }

    // Récupère le RIASEC d'une formation
    function getFormationRiasec(formation) {
      return getFormationInfo(formation)?.riasec || [];
    }

    // Récupère le lien ONISEP d'une formation
    function getOnisepLink(formation) {
      const info = getFormationInfo(formation);
      if (info?.lien) return info.lien;

      if (normalizeType(formation.type) === "EDS") return ONISEP_EDS_LINK;

      return null;
    }

    // Vérifie si une formation correspond aux filtres
    function matchesFormation(formation, filters) {
      const selectedTypes = filters.types;
      const selectedRiasec = filters.riasec;
      const search = filters.search;

      if (selectedTypes.length > 0 && !selectedTypes.includes(formation.type)) {
        return false;
      }

      if (selectedRiasec.length > 0) {
        const formationRiasec = getFormationRiasec(formation);
        const matchRiasec = selectedRiasec.some(code => formationRiasec.includes(code));
        if (!matchRiasec) return false;
      }

      if (search) {
        const nom = getFormationNom(formation);
        const haystack = [nom, formation.id, formation.type]
          .join(' ')
          .toLowerCase();
        if (!haystack.includes(search)) return false;
      }

      return true;
    }

    // Vérifie si un lycée correspond aux filtres
    function matchesFilters(lycee, filters) {
      if (filters.academies.length > 0 && !filters.academies.includes(lycee.academie)) {
        return false;
      }

      if (filters.departements.length > 0) {
        const departmentOption = getDepartmentOption(lycee);
        if (!lycee.departement || !filters.departements.includes(departmentOption.value)) {
          return false;
        }
      }

      if (filters.statuts.length > 0 && !filters.statuts.includes(lycee.statut)) {
        return false;
      }

      if (filters.internat !== '' && String(lycee.internat) !== String(filters.internat)) {
        return false;
      }

      if (filters.selectedFormations && filters.selectedFormations.size > 0) {
        const hasSelectedFormation = (lycee.formations || []).some(f => filters.selectedFormations.has(`${f.type}|${f.id}`));
        if (!hasSelectedFormation) return false;
      }

      if (filters.types.length > 0 || filters.riasec.length > 0 || filters.search) {
        const matchingFormations = (lycee.formations || []).filter(formation => matchesFormation(formation, filters));
        if (matchingFormations.length === 0) return false;
      }

      return true;
    }

    // Affiche les marqueurs sur la carte
    function renderMarkers(lycees, filters = {}) {
      markersLayer.clearLayers();
      markersByLyceeId.clear();

      const hasFormationFilters = (filters.types && filters.types.length > 0) || (filters.riasec && filters.riasec.length > 0) || !!filters.search;

      lycees.forEach(lycee => {
        if (!lycee.latitude || !lycee.longitude) return;

        const marker = L.marker([lycee.latitude, lycee.longitude]);
        markersByLyceeId.set(lycee.id, marker);

        const allFormations = lycee.formations || [];
        const matchingFormations = hasFormationFilters
          ? allFormations.filter(f => matchesFormation(f, filters))
          : allFormations;
        const otherFormations = allFormations.filter(f => !matchingFormations.includes(f));

        const matchingHtml = matchingFormations.map(renderFormationItem).join('');
        const otherHtml = otherFormations.map(renderFormationItem).join('');
        const showToggle = otherFormations.length > 0;
        const extraId = `map-extra-${lycee.id.replace(/[^a-zA-Z0-9]/g, '')}`;

        marker.bindPopup(`
          <div onclick="event.stopPropagation()">
            <b>${lycee.nom}</b>
            <details class="lycee-details">
              <summary>Voir le détail du lycée</summary>
              <div class="lycee-details-content">
                <p><strong>UAI :</strong> ${lycee.id}</p>
                <p><strong>Adresse :</strong> ${lycee.adresse}</p>
                <p><strong>Email :</strong> ${lycee.email}</p>
                <p><strong>Téléphone :</strong> ${lycee.telephone || 'Non renseigné'}</p>
                <p><strong>Académie :</strong> ${lycee.academie} ${lycee.departement ? `(${lycee.departement})` : ''}</p>
                <p><strong>Internat :</strong> ${lycee.internat === 1 ? 'Oui' : 'Non'}</p>
              </div>
            </details>
            <p><strong>Formations${hasFormationFilters ? ` (${matchingFormations.length}/${allFormations.length})` : ''} :</strong></p>
            <ul>${matchingHtml || '<li>Aucune formation correspondante</li>'}</ul>
            ${showToggle ? `
              <button class="formation-toggle" type="button" onclick="(function(btn){var extra=document.getElementById('${extraId}');var hidden=extra.classList.contains('hidden');extra.classList.toggle('hidden');btn.textContent=hidden?'Masquer les autres formations':'Voir toutes les formations (${otherFormations.length})';})(this)">Voir toutes les formations (${otherFormations.length})</button>
              <ul id="${extraId}" class="hidden">${otherHtml}</ul>
            ` : ''}
          </div>
        `);

        marker.on('click', () => selectLycee(lycee.id, { scrollList: true }));
        marker.addTo(markersLayer);
      });
    }

    // Génère le HTML pour une formation dans les résultats
    function renderFormationItem(f) {
      const type = f.type;
      const id = f.id || f.nom;
      const nom = getFormationNom(f);
      const riasecArr = getFormationRiasec(f);
      const riasec = riasecArr.length > 0 ? ` ${renderRiasecIcons(riasecArr)}` : '';
      const description = getFormationDescription(f);
      const link = getOnisepLink(f);
      const linkHtml = link ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="onisep-link" title="${description}">En savoir plus</a>` : '';

      return `
        <li class="formation-item">
          ${renderFormationName(nom, type)}
          ${riasec} ${linkHtml}
          <span class="tooltip">${description}</span>
        </li>
      `;
    }

    // Affiche les résultats dans le panneau latéral
    function renderResults(lycees, filters) {
      const resultsEl = document.getElementById('results');

      if (!lycees.length) {
        resultsEl.innerHTML = '<div class="empty-state">Aucun lycée ne correspond à vos critères.</div>';
        return;
      }

      const hasFormationFilters = filters.types.length > 0 || filters.riasec.length > 0 || !!filters.search;

      resultsEl.innerHTML = lycees.map(lycee => {
        const allFormations = lycee.formations || [];
        const matchingFormations = hasFormationFilters
          ? allFormations.filter(f => matchesFormation(f, filters))
          : allFormations;
        const otherFormations = allFormations.filter(f => !matchingFormations.includes(f));

        const matchingHtml = matchingFormations.map(renderFormationItem).join('');
        const otherHtml = otherFormations.map(renderFormationItem).join('');

        const showToggle = otherFormations.length > 0;
        const toggleId = `toggle-${lycee.id.replace(/[^a-zA-Z0-9]/g, '')}`;
        const extraId = `extra-${lycee.id.replace(/[^a-zA-Z0-9]/g, '')}`;

        return `
          <div class="lycee-card" id="${getLyceeCardDomId(lycee.id)}" data-lycee-id="${lycee.id}">
            <h3>${lycee.nom}</h3>
            <details class="lycee-details">
              <summary>Voir le détail du lycée</summary>
              <div class="lycee-details-content">
                <p><strong>UAI :</strong> ${lycee.id}</p>
                <p><strong>Adresse :</strong> ${lycee.adresse}</p>
                <p><strong>Email :</strong> ${lycee.email}</p>
                <p><strong>Téléphone :</strong> ${lycee.telephone || 'Non renseigné'}</p>
                <p><strong>Académie :</strong> ${lycee.academie} ${lycee.departement ? `(${lycee.departement})` : ''}</p>
                <p><strong>Internat :</strong> ${lycee.internat === 1 ? 'Oui' : 'Non'}</p>
              </div>
            </details>
            <p><strong>Formations${hasFormationFilters ? ` (${matchingFormations.length}/${allFormations.length})` : ''} :</strong></p>
            <ul>${matchingHtml || '<li>Aucune formation correspondante</li>'}</ul>
            ${showToggle ? `
              <button class="formation-toggle" id="${toggleId}" type="button" onclick="(function(btn){var extra=document.getElementById('${extraId}');var hidden=extra.classList.contains('hidden');extra.classList.toggle('hidden');btn.textContent=hidden?'Masquer les autres formations':'Voir toutes les formations ('+${otherFormations.length}+')';})(this)">Voir toutes les formations (${otherFormations.length})</button>
              <ul id="${extraId}" class="hidden">${otherHtml}</ul>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // Fonction pour générer le texte des filtres appliqués
    function getFilterText(filters) {
      const filterParts = [];

      if (filters.riasec.length > 0) {
        const riasecLabels = {
          R: "Réaliste",
          I: "Investigateur",
          A: "Artistique",
          S: "Social",
          E: "Entreprenant",
          C: "Conventionnel"
        };
        const riasecText = filters.riasec.map(code => riasecLabels[code] || code).join(', ');
        filterParts.push(`RIASEC=${riasecText}`);
      }

      if (filters.types.length > 0) {
        const typeLabels = {
          EDS: "Bac général / spécialités",
          techno: "Bac technologique",
          pro: "Bac professionnel",
          cap: "CAP"
        };
        const typeText = filters.types.map(type => typeLabels[type] || type).join(', ');
        filterParts.push(`Type=${typeText}`);
      }

      if (filters.selectedFormations && filters.selectedFormations.size > 0) {
        const formationNames = [...filters.selectedFormations].map(key => {
          const chip = (state.chipsCache || []).find(f => f.key === key);
          return chip ? chip.nom : key.split('|')[1];
        });
        filterParts.push(`Formation(s)=${formationNames.join(', ')}`);
      }

      if (filters.academies.length > 0) {
        filterParts.push(`Académie=${filters.academies.join(', ')}`);
      }

      if (filters.departements.length > 0) {
        filterParts.push(`Département=${filters.departements.join(', ')}`);
      }

      if (filters.statuts.length > 0) {
        filterParts.push(`Statut=${filters.statuts.join(', ')}`);
      }

      if (filters.internat !== '') {
        filterParts.push(`Internat=${filters.internat === '1' ? 'Oui' : 'Non'}`);
      }

      if (filters.search) {
        filterParts.push(`Recherche="${filters.search}"`);
      }

      return filterParts.length > 0 ? ` (Filtres : ${filterParts.join(', ')})` : '';
    }

    // Met à jour le compteur de résultats et le détail des filtres
    function updateResultCounter(lycees, filters) {
      const counterEl = document.getElementById('resultCounter');
      const lyceeCountEl = document.getElementById('lyceeCount');
      const formationCountEl = document.getElementById('formationCount');
      const filterDetailEl = document.getElementById('filterDetail');

      // Compter le nombre d'établissements
      const lyceeCount = lycees.length;
      lyceeCountEl.textContent = lyceeCount;

      // Compter le nombre total de formations (filtrées si des filtres sont appliqués)
      let formationCount = 0;
      const hasFormationFilters = filters.types.length > 0 || filters.riasec.length > 0 || !!filters.search;

      lycees.forEach(lycee => {
        const allFormations = lycee.formations || [];
        if (hasFormationFilters) {
          formationCount += allFormations.filter(f => matchesFormation(f, filters)).length;
        } else {
          formationCount += allFormations.length;
        }
      });

      formationCountEl.textContent = formationCount;

      // Mettre à jour le détail des filtres
      filterDetailEl.textContent = getFilterText(filters);

      // Afficher le compteur uniquement si des filtres sont appliqués ou si c'est la première recherche
      counterEl.classList.toggle('hidden', lyceeCount === 0 && formationCount === 0);
    }

    // Met à jour les départements disponibles selon les académies sélectionnées
    function updateDepartmentOptions() {
      const academies = getSelectedValues('academies');
      const departements = document.getElementById('departements');
      const selectedDepartements = new Set(getSelectedValues('departements'));
      const matchingDepartements = [...new Map(
        state.lycees
          .filter(lycee => academies.includes(lycee.academie))
          .map(getDepartmentOption)
          .filter(option => option.value)
          .map(option => [option.value, option])
      ).values()].sort((a, b) => a.label.localeCompare(b.label, 'fr'));

      departements.replaceChildren(...matchingDepartements.map(department => {
        const option = new Option(department.label, department.value);
        option.selected = selectedDepartements.has(department.value);
        return option;
      }));

      return matchingDepartements.length > 0;
    }

    // Affiche/masque le filtre des départements
    function toggleDepartments() {
      const academies = getSelectedValues('academies');
      const departementsWrapper = document.getElementById('departementsWrapper');
      const shouldShow = academies.length > 0 && updateDepartmentOptions();

      departementsWrapper.classList.toggle('hidden', !shouldShow);

      if (!shouldShow) {
        document.getElementById('departements').replaceChildren();
      }
    }

    // Applique les filtres
    function applyFilters() {
      const filters = {
        riasec: getSelectedValues('riasec'),
        types: getSelectedValues('typeFormation'),
        academies: getSelectedValues('academies'),
        departements: getSelectedValues('departements'),
        search: '', // la recherche par nom a été remplacée par la recherche interne du panneau
        internat: document.getElementById('internat').value,
        statuts: getSelectedValues('statut'),
        selectedFormations: state.selectedFormations
      };

      // Panneau des formations correspondantes (la sélection est ignorée
      // pour calculer les puces, afin que la liste ne se restreigne pas elle-même)
      const previousChips = state.chipsCache;
      const chipFilters = { ...filters, selectedFormations: new Set() };
      const chipSourceLycees = state.lycees.filter(lycee => matchesFilters(lycee, chipFilters));
      state.chipsCache = collectMatchingFormations(chipSourceLycees, filters);

      // Conserve les formations sélectionnées même si elles sortent des nouveaux filtres
      const knownKeys = new Set(state.chipsCache.map(f => f.key));
      for (const key of [...state.selectedFormations]) {
        if (knownKeys.has(key)) continue;
        const previous = previousChips.find(f => f.key === key);
        if (previous) {
          state.chipsCache.push(previous);
        } else {
          state.selectedFormations.delete(key);
        }
      }
      state.chipsCache.sort((a, b) => String(a.nom || '').localeCompare(String(b.nom || ''), 'fr'));
      renderFormationsPanel();

      const filteredLycees = state.lycees.filter(lycee => matchesFilters(lycee, filters));
      renderMarkers(filteredLycees, filters);
      renderResults(filteredLycees, filters);
      updateResultCounter(filteredLycees, filters);
    }

    // Réinitialise les filtres
    function resetFilters() {
      document.getElementById('riasec').selectedIndex = -1;
      document.getElementById('typeFormation').selectedIndex = -1;
      document.getElementById('academies').selectedIndex = -1;
      document.getElementById('departements').selectedIndex = -1;
      document.getElementById('internat').value = '';
      document.getElementById('statut').selectedIndex = -1;
      state.selectedFormations.clear();
      document.getElementById('formationsSearch').value = '';
      toggleDepartments();
      applyFilters();
    }

    // Bascule d'affichage carte / liste / les deux
    function setView(mode) {
      const container = document.getElementById('container');
      const btnBoth = document.getElementById('viewBoth');
      const btnMap = document.getElementById('viewMap');
      const btnList = document.getElementById('viewList');

      container.classList.remove('view-map', 'view-list');
      btnBoth.classList.remove('active');
      btnMap.classList.remove('active');
      btnList.classList.remove('active');

      if (mode === 'map') {
        container.classList.add('view-map');
        btnMap.classList.add('active');
      } else if (mode === 'list') {
        container.classList.add('view-list');
        btnList.classList.add('active');
      } else {
        btnBoth.classList.add('active');
      }

      setTimeout(() => map.invalidateSize(), 100);
    }

    // Identifiant DOM d'une carte de lycée
    function getLyceeCardDomId(lyceeId) {
      return `lycee-card-${String(lyceeId || '').replace(/[^a-zA-Z0-9]/g, '')}`;
    }

    // Sélectionne un lycée et synchronise la carte et la liste
    function selectLycee(lyceeId, options = {}) {
      const { scrollList = false, showOnMap = false } = options;

      document.querySelectorAll('.lycee-card.selected').forEach(card => card.classList.remove('selected'));

      const card = document.getElementById(getLyceeCardDomId(lyceeId));
      if (card) {
        card.classList.add('selected');
        if (scrollList) {
          const resultsEl = document.getElementById('results');
          resultsEl.scrollTop = card.offsetTop - resultsEl.clientHeight / 2 + card.offsetHeight / 2;
        }
      }

      if (showOnMap) {
        const marker = markersByLyceeId.get(lyceeId);
        if (marker) {
          map.panTo(marker.getLatLng());
          marker.openPopup();
        }
      }
    }

    // Clic sur une carte de la liste -> sélection et affichage sur la carte
    document.getElementById('results').addEventListener('click', event => {
      if (event.target.closest('a')) return; // laisser passer les liens ONISEP
      const card = event.target.closest('.lycee-card');
      if (!card || !card.dataset.lyceeId) return;
      selectLycee(card.dataset.lyceeId, { showOnMap: true });
    });

    // Collecte les formations distinctes correspondant aux filtres
    function collectMatchingFormations(lycees, filters) {
      const map = new Map();

      lycees.forEach(lycee => {
        (lycee.formations || []).forEach(f => {
          if (!matchesFormation(f, filters)) return;
          if (!f.id) return; // ignore les formations sans code
          const key = `${f.type}|${f.id}`;
          if (!map.has(key)) {
            map.set(key, {
              key,
              type: f.type,
              id: f.id,
              nom: getFormationNom(f)
            });
          }
        });
      });

      return [...map.values()].sort((a, b) => String(a.nom || '').localeCompare(String(b.nom || ''), 'fr'));
    }

    // Affiche le panneau des formations correspondantes (puces cliquables)
    function renderFormationsPanel() {
      const listEl = document.getElementById('formationsList');
      const countEl = document.getElementById('formationsCount');
      const query = normalize(document.getElementById('formationsSearch').value);
      const formations = state.chipsCache;
      const visible = query
        ? formations.filter(f => normalize(f.nom).includes(query) || normalize(f.id).includes(query))
        : formations;

      countEl.textContent = query ? `${visible.length}/${formations.length}` : String(formations.length);

      if (visible.length === 0) {
        listEl.innerHTML = '<span class="empty-state">Aucune formation correspondante.</span>';
        return;
      }

      const typeLabels = {
        EDS: 'Bac général / spécialités',
        techno: 'Bac technologique',
        pro: 'Bac professionnel',
        cap: 'CAP',
        CAP: 'CAP'
      };

      listEl.innerHTML = visible.map(f => {
        const typeClass = f.type === 'CAP' ? 'cap' : String(f.type).toLowerCase();
        const selected = state.selectedFormations.has(f.key);
        return `<button type="button" class="formation-chip ${typeClass}${selected ? ' selected' : ''}" data-key="${f.key}" title="${typeLabels[f.type] || f.type} : ${f.nom}">${f.nom}</button>`;
      }).join('');
    }

    // Clic sur une formation : active/désactive le filtre formation
    document.getElementById('formationsList').addEventListener('click', event => {
      const chip = event.target.closest('.formation-chip');
      if (!chip) return;

      const key = chip.dataset.key;
      if (state.selectedFormations.has(key)) {
        state.selectedFormations.delete(key);
      } else {
        state.selectedFormations.add(key);
      }
      applyFilters();
    });

    // Recherche interne dans le panneau de formations
    document.getElementById('formationsSearch').addEventListener('input', renderFormationsPanel);

    // Initialisation des écouteurs d'événements
    document.getElementById('resetBtn').addEventListener('click', resetFilters);
    document.getElementById('academies').addEventListener('change', toggleDepartments);

    // Actualisation en direct pendant la modification des filtres
    ['riasec', 'typeFormation', 'academies', 'departements', 'internat', 'statut'].forEach(id => {
      document.getElementById(id).addEventListener('change', applyFilters);
    });
    document.getElementById('viewBoth').addEventListener('click', () => setView('both'));
    document.getElementById('viewMap').addEventListener('click', () => setView('map'));
    document.getElementById('viewList').addEventListener('click', () => setView('list'));

    // Chargement des données au démarrage
    loadData();
  </script>
</body>
</html>
