<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recherche de lycées d'Île-de-France</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --border: #dfe7f3;
      --primary: #0d6efd;
      --primary-dark: #0a58ca;
      --text: #1f2937;
      --muted: #6b7280;
      --shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin: 20px 20px 10px;
      font-size: 2rem;
    }

    .filters {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin: 0 20px 20px;
      padding: 20px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px 24px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    select,
    input,
    button {
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    select,
    input {
      width: 100%;
      background: #fff;
    }

    select[multiple] {
      min-height: 120px;
    }

    .riasec-icons {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .riasec-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5em;
      height: 1.5em;
      font-size: 1.05em;
      line-height: 1;
    }

    #typeFormation option {
      font-weight: 700;
    }

    #typeFormation option.filter-type-eds {
      color: #213d6d;
    }

    #typeFormation option.filter-type-techno {
      color: #d90000;
    }

    #typeFormation option.filter-type-pro {
      color: #008000;
    }

    #typeFormation option.filter-type-cap {
      color: #43b843;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: white;
      font-weight: 600;
      min-width: 160px;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #e9ecef;
      color: var(--text);
    }

    .secondary:hover {
      background: #dfe3e8;
    }

    .instructions {
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .view-toggle {
      display: flex;
      gap: 8px;
      margin: 0 20px 16px;
    }

    .view-toggle button {
      min-width: auto;
      padding: 8px 16px;
      font-size: 0.9rem;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .view-toggle button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .container {
      display: flex;
      gap: 20px;
      margin: 0 20px 30px;
      position: relative;
    }

    .container.view-map .map-container { width: 100%; }
    .container.view-map .results { display: none; }

    .container.view-list .map-container { display: none; }
    .container.view-list .results { width: 100%; max-height: none; }

    .map-container {
      width: 60%;
      min-height: 620px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    #map {
      width: 100%;
      height: 620px;
      background: #dfeaf7;
    }

    .results {
      width: 40%;
      max-height: 620px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 12px;
      position: relative;
      z-index: 1;
    }

    .lycee-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      margin-bottom: 12px;
      background: #fff;
      position: relative; /* Ajout pour le positionnement des tooltips */
    }

    .lycee-card h3 {
      margin: 0 0 6px;
      font-size: 1.05rem;
    }

    .lycee-details {
      margin: 8px 0 12px;
    }

    .lycee-details summary {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #e9ecef;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      list-style-position: inside;
    }

    .lycee-details summary:hover {
      background: #dfe3e8;
    }

    .lycee-details-content {
      margin-top: 8px;
    }

    .lycee-card p {
      margin: 5px 0;
      line-height: 1.4;
      font-size: 0.92rem;
    }

    .lycee-card ul {
      margin: 8px 0 0 18px;
      padding: 0;
    }

    .formation-toggle {
      margin-top: 8px;
      background: #e9ecef;
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      min-width: auto;
      padding: 6px 12px;
    }

    .formation-toggle:hover {
      background: #dfe3e8;
    }

    .hidden {
      display: none;
    }

    .empty-state {
      padding: 20px;
      color: var(--muted);
      font-style: italic;
    }

    /* Style pour les liens ONISEP */
    .onisep-link {
      color: var(--primary);
      text-decoration: none;
      margin-left: 6px;
      font-size: 0.9em;
      cursor: pointer;
    }

    .onisep-link:hover {
      text-decoration: underline;
    }

    /* Style pour les tooltips (à gauche) */
    .formation-item {
      position: relative;
      cursor: default;
      z-index: 2; /* Assure que le tooltip est au-dessus des autres éléments */
    }

    .formation-item:hover {
      z-index: 1000;
    }

    .formation-name {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      border: 2px solid;
    }

    .formation-name-eds {
      border-color: #213d6d;
    }

    .formation-name-techno {
      border-color: #d90000;
    }

    .formation-name-pro {
      border-color: #008000;
    }

    .formation-name-cap {
      border-color: #43b843;
    }

    .tooltip {
      visibility: hidden;
      position: absolute;
      left: 0;
      top: 100%;
      margin-top: 5px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
      white-space: normal;
      box-shadow: var(--shadow);
      z-index: 1000;
      max-width: 280px;
      width: max-content;
      pointer-events: none;
    }

    .formation-item:hover .tooltip {
      visibility: visible;
      z-index: 1001;
    }

    .tooltip::after {
      content: "";
      position: absolute;
      top: -6px;
      left: 14px;
      border-width: 6px;
      border-style: solid;
      border-color: transparent transparent var(--border) transparent;
    }

    @media (max-width: 980px) {
      .container {
        flex-direction: column;
      }

      .map-container,
      .results {
        width: 100%;
      }

      .container.view-list .results {
        max-height: 620px;
      }
    }
  </style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
  <h1>Recherche de lycées et de formations</h1>

  <div class="filters">
    <div class="instructions">Utilisez Ctrl/Cmd + clic pour sélectionner plusieurs valeurs.</div>

    <div class="filters-grid">
      <div class="field">
        <label for="riasec">Domaines RIASEC</label>
        <select id="riasec" multiple>
          <option value="R">🔨 Réaliste</option>
          <option value="I">⚗️ Investigateur</option>
          <option value="A">🎨 Artistique</option>
          <option value="S">🤝 Social</option>
          <option value="E">💼 Entreprenant</option>
          <option value="C">🧮 Conventionnel</option>
        </select>
      </div>

      <div class="field">
        <label for="typeFormation">Type de formation</label>
        <select id="typeFormation" multiple>
          <option value="EDS" class="filter-type-eds">Bac général / spécialités</option>
          <option value="techno" class="filter-type-techno">Bac technologique</option>
          <option value="pro" class="filter-type-pro">Bac professionnel</option>
          <option value="cap" class="filter-type-cap">CAP</option>
        </select>
      </div>

      <div class="field">
        <label for="nomFormation">Nom / code de la formation</label>
        <input id="nomFormation" type="text" placeholder="Ex: STI2D, NSI, Math, Arts" />
      </div>

      <div class="field">
        <label for="academies">Académie</label>
        <select id="academies" multiple>
          <option value="Paris">Paris</option>
          <option value="Versailles">Versailles</option>
          <option value="Créteil">Créteil</option>
        </select>
      </div>

      <div class="field hidden" id="departementsWrapper">
        <label for="departements">Département</label>
        <select id="departements" multiple></select>
      </div>

      <div class="field">
        <label for="statut">Statut</label>
        <select id="statut" multiple>
          <option value="Public">Public</option>
          <option value="Privé sous contrat">Privé sous contrat</option>
          <option value="Privé">Privé hors contrat</option>
        </select>
      </div>

      <div class="field">
        <label for="internat">Internat</label>
        <select id="internat">
          <option value="">Tous</option>
          <option value="1">Oui</option>
          <option value="0">Non</option>
        </select>
      </div>
    </div>

    <div class="button-row">
      <button id="applyBtn" type="button">Appliquer les filtres</button>
      <button id="resetBtn" type="button" class="secondary">Réinitialiser</button>
    </div>
  </div>

  <div class="view-toggle">
    <button id="viewBoth" type="button" class="active">Carte + Liste</button>
    <button id="viewMap" type="button">Carte uniquement</button>
    <button id="viewList" type="button">Liste uniquement</button>
  </div>

  <div class="container" id="container">
    <div class="map-container">
      <div id="map"></div>
    </div>
    <div id="results" class="results"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Lien ONISEP unique pour toutes les EDS
    const ONISEP_EDS_LINK = "https://www.onisep.fr/formation/apres-la-2-les-poursuites-d-etudes/les-enseignements-de-specialite-en-voie-generale";

    // Données de fallback minimales (pour le développement local)
    const fallbackLycees = [
      {
        id: "LYC001",
        nom: "Lycée Polyvalent Dorian",
        adresse: "12 rue de la Montagne Sainte-Geneviève, 75005 Paris",
        academie: "Paris",
        departement: "Paris",
        email: "contact@lyc-dorian.fr",
        telephone: "01 45 88 32 10",
        latitude: 48.8419,
        longitude: 2.3636,
        internat: 0,
        formations: [
          { id: "NSI", nom: "Numériques et Sciences Informatiques", riasec: ["I", "R"], type: "EDS" },
          { id: "SVT", nom: "Sciences et vie de la Terre", riasec: ["I", "R"], type: "EDS" },
          { id: "BACPRO-SN", nom: "Bac Pro Systèmes Numériques", riasec: ["R", "I"], type: "pro" }
        ]
      },
      {
        id: "LYC002",
        nom: "Lycée Technologique ABC",
        adresse: "10 rue des Études, 75000 Paris",
        academie: "Paris",
        departement: "Paris",
        email: "contact@lyc-abc.fr",
        telephone: "01 23 45 67 89",
        latitude: 48.8566,
        longitude: 2.3522,
        internat: 1,
        formations: [
          { id: "STI2D-AC", nom: "STI2D - Architecture et Construction", riasec: ["R", "I"], type: "techno" },
          { id: "STI2D-SIN", nom: "STI2D - Système d'Information et Numérique", riasec: ["R", "I"], type: "techno" },
          { id: "STMG-GF", nom: "STMG - Gestion et Finance", riasec: ["C", "E"], type: "techno" }
        ]
      }
    ];

    // État global de l'application
    const state = {
      lycees: [],
      onisepLinks: {},   // links depuis formations.json
      descriptions: {},  // descriptions depuis formations.json
      riasec: {},         // riasec depuis formations.json
      noms: {}            // noms depuis formations.json
    };

    // Initialisation de la carte Leaflet
    const map = L.map('map').setView([48.8566, 2.3522], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    const markersLayer = L.layerGroup().addTo(map);

    // Fonction pour récupérer les valeurs sélectionnées dans un <select multiple>
    function getSelectedValues(selectId) {
      const select = document.getElementById(selectId);
      return Array.from(select.selectedOptions).map(option => option.value);
    }

    // Normalisation des chaînes de caractères pour la recherche
    function normalize(value) {
      return String(value || '').trim().toLowerCase();
    }

    function getArrondissement(lycee) {
      if (lycee.arrondissement) return lycee.arrondissement;

      const postalCode = String(lycee.adresse || '').match(/,\s*(75(?:0\d{2}|1\d{2}))\s+Paris\b/)?.[1];
      if (!postalCode) return '';

      const number = Number(postalCode.slice(-2));
      return number >= 1 && number <= 20 ? `${number}e arrondissement` : '';
    }

    function getDepartmentOption(lycee) {
      const arrondissement = lycee.academie === 'Paris' && lycee.departement === 'Paris'
        ? getArrondissement(lycee)
        : '';

      if (arrondissement) {
        return {
          value: `Paris|${arrondissement}`,
          label: `Paris - ${arrondissement}`
        };
      }

      return {
        value: lycee.departement,
        label: lycee.departement
      };
    }

    const RIASEC_ICONS = {
      R: ['🔨', 'Réaliste'],
      I: ['⚗️', 'Investigateur'],
      A: ['🎨', 'Artistique'],
      S: ['🤝', 'Social'],
      E: ['💼', 'Entreprenant'],
      C: ['🧮', 'Conventionnel']
    };

    function renderRiasecIcons(codes) {
      return `<span class="riasec-icons" aria-label="RIASEC : ${codes.map(code => RIASEC_ICONS[code]?.[1] || code).join(', ')}">${codes.map(code => {
        const [icon, label] = RIASEC_ICONS[code] || [code, code];
        return `<span class="riasec-icon" title="${label}" aria-label="${label}">${icon}</span>`;
      }).join('')}</span>`;
    }

    function getFormationNameClass(type) {
      return `formation-name-${type === 'CAP' ? 'cap' : String(type).toLowerCase()}`;
    }

    function renderFormationName(name, type) {
      return `<span class="formation-name ${getFormationNameClass(type)}">${name}</span>`;
    }

    // Normalise la casse du type pour les recherches dans formations.json
    // lycees.json utilise "cap" (minuscule), formations.json utilise "CAP" (majuscule)
    function normalizeType(type) {
      if (type === 'cap') return 'CAP';
      return type;
    }

    // Charge les données de formations (liens, descriptions, riasec, noms)
    async function loadOnisepData() {
      const candidates = ['./formations.json', '/formations.json', 'formations.json'];
      let lastError = null;

      for (const url of candidates) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          state.onisepLinks = data.links || {};
          state.descriptions = data.descriptions || {};
          state.riasec = data.riasec || {};
          state.noms = data.noms || {};
          return;
        } catch (error) {
          lastError = error;
        }
      }

      console.warn('Chargement de formations.json impossible.', lastError);
      state.onisepLinks = { EDS: {}, techno: {}, pro: {}, CAP: {} };
      state.descriptions = { EDS: {}, techno: {}, pro: {}, CAP: {} };
      state.riasec = { EDS: {}, techno: {}, pro: {}, CAP: {} };
      state.noms = { EDS: {}, techno: {}, pro: {}, CAP: {} };
    }

    // Charge les données des lycées
    async function loadLyceesData() {
      const candidates = ['./lycees.json', '/lycees.json', 'lycees.json'];
      let lastError = null;

      for (const url of candidates) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          state.lycees = await response.json();
          return;
        } catch (error) {
          lastError = error;
        }
      }

      console.warn('Chargement de lycees.json impossible, utilisation du fallback local.', lastError);
      state.lycees = fallbackLycees;
    }

    // Charge toutes les données nécessaires
    async function loadData() {
      await Promise.all([loadOnisepData(), loadLyceesData()]);
      updateDepartmentOptions();
      applyFilters();
    }

    // Récupère le nom d'une formation
    function getFormationNom(formation) {
      const type = normalizeType(formation.type);
      const id = formation.id || formation.nom;
      const entry = state.noms[type]?.[id];
      if (typeof entry === 'string') return entry;
      if (entry && entry.nom) return entry.nom;
      return id;
    }

    // Récupère la description d'une formation
    function getFormationDescription(formation) {
      const type = normalizeType(formation.type);
      const id = formation.id || formation.nom;
      const desc = state.descriptions[type]?.[id];
      if (desc) return desc;
      const nomEntry = state.noms[type]?.[id];
      if (nomEntry && typeof nomEntry === 'object' && nomEntry.description) return nomEntry.description;
      return "Description non disponible.";
    }

    // Récupère le RIASEC d'une formation
    function getFormationRiasec(formation) {
      const type = normalizeType(formation.type);
      const id = formation.id || formation.nom;
      const riasec = state.riasec[type]?.[id];
      if (riasec) return riasec;
      const nomEntry = state.noms[type]?.[id];
      if (nomEntry && typeof nomEntry === 'object' && nomEntry.riasec) return nomEntry.riasec;
      return [];
    }

    // Récupère le lien ONISEP d'une formation
    function getOnisepLink(formation) {
      const type = normalizeType(formation.type);
      const id = formation.id || formation.nom;

      const link = state.onisepLinks[type]?.[id];
      if (link) return link;

      const nomEntry = state.noms[type]?.[id];
      if (nomEntry && typeof nomEntry === 'object' && nomEntry.lien) return nomEntry.lien;

      if (type === "EDS") return ONISEP_EDS_LINK;

      return null;
    }

    // Vérifie si une formation correspond aux filtres
    function matchesFormation(formation, filters) {
      const selectedTypes = filters.types;
      const selectedRiasec = filters.riasec;
      const search = filters.search;

      if (selectedTypes.length > 0 && !selectedTypes.includes(formation.type)) {
        return false;
      }

      if (selectedRiasec.length > 0) {
        const formationRiasec = getFormationRiasec(formation);
        const matchRiasec = selectedRiasec.some(code => formationRiasec.includes(code));
        if (!matchRiasec) return false;
      }

      if (search) {
        const nom = getFormationNom(formation);
        const haystack = [nom, formation.id, formation.type]
          .join(' ')
          .toLowerCase();
        if (!haystack.includes(search)) return false;
      }

      return true;
    }

    // Vérifie si un lycée correspond aux filtres
    function matchesFilters(lycee, filters) {
      if (filters.academies.length > 0 && !filters.academies.includes(lycee.academie)) {
        return false;
      }

      if (filters.departements.length > 0) {
        const departmentOption = getDepartmentOption(lycee);
        if (!lycee.departement || !filters.departements.includes(departmentOption.value)) {
          return false;
        }
      }

      if (filters.statuts.length > 0 && !filters.statuts.includes(lycee.statut)) {
        return false;
      }

      if (filters.internat !== '' && String(lycee.internat) !== String(filters.internat)) {
        return false;
      }

      if (filters.types.length > 0 || filters.riasec.length > 0 || filters.search) {
        const matchingFormations = (lycee.formations || []).filter(formation => matchesFormation(formation, filters));
        if (matchingFormations.length === 0) return false;
      }

      return true;
    }

    // Affiche les marqueurs sur la carte
    function renderMarkers(lycees) {
      markersLayer.clearLayers();

      lycees.forEach(lycee => {
        if (!lycee.latitude || !lycee.longitude) return;

        const marker = L.marker([lycee.latitude, lycee.longitude]);
        const formationsList = (lycee.formations || [])
          .map(f => {
            const type = f.type;
            const id = f.id || f.nom;
            const nom = getFormationNom(f);
            const riasecArr = getFormationRiasec(f);
            const riasec = riasecArr.length > 0 ? ` ${renderRiasecIcons(riasecArr)}` : '';
            const description = getFormationDescription(f);
            const link = getOnisepLink(f);
            const linkHtml = link ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="onisep-link" title="${description}">En savoir plus</a>` : '';
            return `- ${renderFormationName(nom, type)}${riasec} ${linkHtml}`;
          })
          .join('<br>');

        marker.bindPopup(`
          <b>${lycee.nom}</b><br>
          ${lycee.adresse}<br>
          ${lycee.email}<br>
          ${lycee.telephone || 'Non renseigné'}<br>
          Internat : ${lycee.internat === 1 ? 'Oui' : 'Non'}<br><br>
          <b>Formations :</b><br>
          ${formationsList || 'Aucune formation'}
        `);

        marker.addTo(markersLayer);
      });
    }

    // Génère le HTML pour une formation dans les résultats
    function renderFormationItem(f) {
      const type = f.type;
      const id = f.id || f.nom;
      const nom = getFormationNom(f);
      const riasecArr = getFormationRiasec(f);
      const riasec = riasecArr.length > 0 ? ` ${renderRiasecIcons(riasecArr)}` : '';
      const description = getFormationDescription(f);
      const link = getOnisepLink(f);
      const linkHtml = link ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="onisep-link" title="${description}">En savoir plus</a>` : '';

      return `
        <li class="formation-item">
          ${renderFormationName(nom, type)}
          ${riasec} ${linkHtml}
          <span class="tooltip">${description}</span>
        </li>
      `;
    }

    // Affiche les résultats dans le panneau latéral
    function renderResults(lycees, filters) {
      const resultsEl = document.getElementById('results');

      if (!lycees.length) {
        resultsEl.innerHTML = '<div class="empty-state">Aucun lycée ne correspond à vos critères.</div>';
        return;
      }

      const hasFormationFilters = filters.types.length > 0 || filters.riasec.length > 0 || !!filters.search;

      resultsEl.innerHTML = lycees.map(lycee => {
        const allFormations = lycee.formations || [];
        const matchingFormations = hasFormationFilters
          ? allFormations.filter(f => matchesFormation(f, filters))
          : allFormations;
        const otherFormations = allFormations.filter(f => !matchingFormations.includes(f));

        const matchingHtml = matchingFormations.map(renderFormationItem).join('');
        const otherHtml = otherFormations.map(renderFormationItem).join('');

        const showToggle = otherFormations.length > 0;
        const toggleId = `toggle-${lycee.id.replace(/[^a-zA-Z0-9]/g, '')}`;
        const extraId = `extra-${lycee.id.replace(/[^a-zA-Z0-9]/g, '')}`;

        return `
          <div class="lycee-card">
            <h3>${lycee.nom}</h3>
            <details class="lycee-details">
              <summary>Voir le détail du lycée</summary>
              <div class="lycee-details-content">
                <p><strong>UAI :</strong> ${lycee.id}</p>
                <p><strong>Adresse :</strong> ${lycee.adresse}</p>
                <p><strong>Email :</strong> ${lycee.email}</p>
                <p><strong>Téléphone :</strong> ${lycee.telephone || 'Non renseigné'}</p>
                <p><strong>Académie :</strong> ${lycee.academie} ${lycee.departement ? `(${lycee.departement})` : ''}</p>
                <p><strong>Internat :</strong> ${lycee.internat === 1 ? 'Oui' : 'Non'}</p>
              </div>
            </details>
            <p><strong>Formations${hasFormationFilters ? ` (${matchingFormations.length}/${allFormations.length})` : ''} :</strong></p>
            <ul>${matchingHtml || '<li>Aucune formation correspondante</li>'}</ul>
            ${showToggle ? `
              <button class="formation-toggle" id="${toggleId}" type="button" onclick="(function(btn){var extra=document.getElementById('${extraId}');var hidden=extra.classList.contains('hidden');extra.classList.toggle('hidden');btn.textContent=hidden?'Masquer les autres formations':'Voir toutes les formations ('+${otherFormations.length}+')';})(this)">Voir toutes les formations (${otherFormations.length})</button>
              <ul id="${extraId}" class="hidden">${otherHtml}</ul>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // Met à jour les départements disponibles selon les académies sélectionnées
    function updateDepartmentOptions() {
      const academies = getSelectedValues('academies');
      const departements = document.getElementById('departements');
      const selectedDepartements = new Set(getSelectedValues('departements'));
      const matchingDepartements = [...new Map(
        state.lycees
          .filter(lycee => academies.includes(lycee.academie))
          .map(getDepartmentOption)
          .filter(option => option.value)
          .map(option => [option.value, option])
      ).values()].sort((a, b) => a.label.localeCompare(b.label, 'fr'));

      departements.replaceChildren(...matchingDepartements.map(department => {
        const option = new Option(department.label, department.value);
        option.selected = selectedDepartements.has(department.value);
        return option;
      }));

      return matchingDepartements.length > 0;
    }

    // Affiche/masque le filtre des départements
    function toggleDepartments() {
      const academies = getSelectedValues('academies');
      const departementsWrapper = document.getElementById('departementsWrapper');
      const shouldShow = academies.length > 0 && updateDepartmentOptions();

      departementsWrapper.classList.toggle('hidden', !shouldShow);

      if (!shouldShow) {
        document.getElementById('departements').replaceChildren();
      }
    }

    // Applique les filtres
    function applyFilters() {
      const filters = {
        riasec: getSelectedValues('riasec'),
        types: getSelectedValues('typeFormation'),
        academies: getSelectedValues('academies'),
        departements: getSelectedValues('departements'),
        search: normalize(document.getElementById('nomFormation').value),
        internat: document.getElementById('internat').value,
        statuts: getSelectedValues('statut')
      };

      const filteredLycees = state.lycees.filter(lycee => matchesFilters(lycee, filters));
      renderMarkers(filteredLycees);
      renderResults(filteredLycees, filters);
    }

    // Réinitialise les filtres
    function resetFilters() {
      document.getElementById('riasec').selectedIndex = -1;
      document.getElementById('typeFormation').selectedIndex = -1;
      document.getElementById('nomFormation').value = '';
      document.getElementById('academies').selectedIndex = -1;
      document.getElementById('departements').selectedIndex = -1;
      document.getElementById('internat').value = '';
      document.getElementById('statut').selectedIndex = -1;
      toggleDepartments();
      applyFilters();
    }

    // Bascule d'affichage carte / liste / les deux
    function setView(mode) {
      const container = document.getElementById('container');
      const btnBoth = document.getElementById('viewBoth');
      const btnMap = document.getElementById('viewMap');
      const btnList = document.getElementById('viewList');

      container.classList.remove('view-map', 'view-list');
      btnBoth.classList.remove('active');
      btnMap.classList.remove('active');
      btnList.classList.remove('active');

      if (mode === 'map') {
        container.classList.add('view-map');
        btnMap.classList.add('active');
      } else if (mode === 'list') {
        container.classList.add('view-list');
        btnList.classList.add('active');
      } else {
        btnBoth.classList.add('active');
      }

      setTimeout(() => map.invalidateSize(), 100);
    }

    // Initialisation des écouteurs d'événements
    document.getElementById('applyBtn').addEventListener('click', applyFilters);
    document.getElementById('resetBtn').addEventListener('click', resetFilters);
    document.getElementById('academies').addEventListener('change', toggleDepartments);
    document.getElementById('viewBoth').addEventListener('click', () => setView('both'));
    document.getElementById('viewMap').addEventListener('click', () => setView('map'));
    document.getElementById('viewList').addEventListener('click', () => setView('list'));

    // Chargement des données au démarrage
    loadData();
  </script>
</body>
</html>
